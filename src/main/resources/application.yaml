app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

igdb:
  client-id: ${IGDB_CLIENT_ID:}
  client-secret: ${IGDB_CLIENT_SECRET:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:${app.frontend-url}/checkout/success}
  cancel-url: ${STRIPE_CANCEL_URL:${app.frontend-url}/checkout/cancel}

payment:
  pending-expiration-minutes: ${PAYMENT_PENDING_EXPIRATION_MINUTES:30}
  expiration-check-rate-ms: ${PAYMENT_EXPIRATION_CHECK_RATE_MS:900000}

spring:
  application:
    name: new-game-plus
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/new_game_plus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
